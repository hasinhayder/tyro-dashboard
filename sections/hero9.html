<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tyro Dashboard - Hero Option 9</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <style>
        :root {
            --hero-9-orange: #ff5f1f;
            --hero-9-dark: #111111;
        }

        .hero-9 {
            min-height: 100vh;
            background: var(--color-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px 20px 100px;
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .hero-9-container {
            max-width: 1000px;
            position: relative;
            z-index: 10;
        }

        .hero-9-title {
            font-family: var(--font-display);
            font-size: clamp(3.5rem, 12vw, 8rem);
            font-weight: 900;
            line-height: 0.85;
            letter-spacing: -0.06em;
            color: var(--color-text);
            margin-bottom: 1.5rem;
            position: relative;
        }

        .hero-9-title .accent {
            color: var(--hero-9-orange);
            display: block;
            margin-top: 0.2em;
        }

        .hero-9-description {
            font-size: 1.25rem;
            color: var(--color-text-secondary);
            max-width: 600px;
            margin: 0 auto 3rem;
            line-height: 1.6;
            font-weight: 500;
        }

        /* Floating Elements */
        .floating-element {
            position: absolute;
            z-index: 5;
            pointer-events: none;
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.15));
            animation: float-slow 6s ease-in-out infinite;
        }

        @keyframes float-slow {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(10px, -20px) rotate(5deg); }
            66% { transform: translate(-10px, 10px) rotate(-5deg); }
        }

        /* Mockup elements mimicking the image */
        .el-toggle { top: 20%; right: 10%; animation-delay: 0s; }
        .el-lock { bottom: 25%; right: 5%; animation-delay: 1s; }
        .el-bolt { bottom: 30%; left: 15%; animation-delay: 2s; }
        .el-card-1 { top: 25%; left: 5%; transform: rotate(-15deg); animation-delay: 0.5s; }
        .el-card-2 { top: 45%; left: 12%; transform: rotate(-5deg); animation-delay: 1.5s; }
        .el-cursor { top: 55%; left: 25%; animation-delay: 0.2s; }

        .hero-9-cta-btn {
            background: var(--hero-9-dark);
            color: white;
            padding: 20px 60px;
            border-radius: 12px;
            font-size: 1.25rem;
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 15px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: none;
            cursor: pointer;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        [data-theme="dark"] .hero-9-cta-btn {
            background: white;
            color: var(--hero-9-dark);
        }

        .hero-9-cta-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
        }

        .cta-arrow {
            width: 30px;
            height: 30px;
            background: var(--hero-9-orange);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transform: rotate(-15deg);
        }

        /* SVG Element Styles */
        .svg-card {
            width: 140px;
            height: 90px;
            background: white;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border: 1px solid rgba(0,0,0,0.05);
        }

        @media (max-width: 768px) {
            .hero-9-title { font-size: 4rem; }
            .floating-element { display: none; }
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="../index.html" class="navbar-brand">
                <span class="navbar-logo">Tyro Dashboard</span>
                <span class="navbar-badge">v1.12.0</span>
            </a>

            <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle menu">
                <span></span><span></span><span></span>
            </button>

            <div class="navbar-links">
                <a href="../index.html#features" class="navbar-link">Features</a>
                <a href="../index.html#crud-showcase" class="navbar-link">Instant CRUD</a>
                <a href="../doc.html" class="navbar-link">Documentation</a>
                <a href="../index.html#installation" class="btn btn-primary" style="background: var(--hero-9-orange); box-shadow: 0 10px 20px rgba(255,95,31,0.2);">
                    Install Now
                </a>
            </div>
        </div>
    </nav>

    <!-- Theme Toggle -->
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </button>

    <section class="hero-9">
        <!-- Floating Elements -->
        <div class="floating-element el-card-1">
            <div class="svg-card" style="background: #ffce00; color: #8b5e00;">
                <div style="font-weight: 800; font-size: 0.8rem;">CRUD</div>
                <div style="font-size: 1.2rem; font-weight: 900;">Instant</div>
            </div>
        </div>
        <div class="floating-element el-card-2">
            <div class="svg-card" style="background: #22c55e; color: white;">
                <div style="font-weight: 800; font-size: 0.8rem;">RBAC</div>
                <div style="font-size: 1.2rem; font-weight: 900;">Secure</div>
            </div>
        </div>
        
        <div class="floating-element el-toggle">
            <svg width="80" height="44" viewBox="0 0 80 44" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="80" height="44" rx="22" fill="#22c55e"/>
                <circle cx="58" cy="22" r="16" fill="white"/>
            </svg>
        </div>

        <div class="floating-element el-lock">
            <div style="background: #3b82f6; width: 70px; height: 70px; border-radius: 18px; display: flex; align-items: center; justify-content: center; color: white;">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </div>
        </div>

        <div class="floating-element el-bolt">
            <div style="background: #ff5f1f; width: 60px; height: 60px; border-radius: 15px; display: flex; align-items: center; justify-content: center; color: white; transform: rotate(-10deg);">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
            </div>
        </div>

        <div class="floating-element el-cursor">
            <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M14 10L32 24L23 26L21 35L14 10Z" fill="#111111" stroke="white" stroke-width="3" stroke-linejoin="round"/>
            </svg>
        </div>

        <div class="hero-9-container">
            <h1 class="hero-9-title">
                Panels <br>that feel
                <span class="accent">effortless</span>
            </h1>
            <p class="hero-9-description">
                Designed for modern Laravel experiences that feel seamless from the first installation to the final deployment.
            </p>
            
            <a href="../index.html#installation" class="hero-9-cta-btn">
                Get started
                <div class="cta-arrow">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>
                </div>
            </a>
        </div>
    </section>

    <script src="../script.js"></script>
    <script>
        // Theme sync logic
        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                if (mutation.type === 'attributes' && mutation.attributeName === 'data-theme') {
                    // Update any dynamic elements if needed
                }
            });
        });
        observer.observe(document.documentElement, { attributes: true });
    </script>
</body>

</html>
