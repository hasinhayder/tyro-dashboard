<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tyro Dashboard - Hero Option 7</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <style>
        .hero-grid {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: calc(80px + var(--spacing-2xl)) 0 var(--spacing-4xl);
            background-color: var(--color-bg);
            background-image: 
                linear-gradient(rgba(37, 99, 235, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(37, 99, 235, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            overflow: hidden;
            position: relative;
        }

        [data-theme="dark"] .hero-grid {
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }

        .hero-grid-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-4xl);
            align-items: center;
        }

        .hero-grid-content {
            z-index: 10;
        }

        .hero-grid-label {
            display: inline-block;
            font-family: var(--font-mono);
            font-size: 0.875rem;
            color: var(--color-primary);
            margin-bottom: var(--spacing-md);
            border: 1px solid var(--color-primary);
            padding: 4px 12px;
            background: rgba(37, 99, 235, 0.05);
        }

        .hero-grid-title {
            font-family: var(--font-display);
            font-size: clamp(3rem, 6vw, 5rem);
            font-weight: 900;
            line-height: 0.95;
            letter-spacing: -0.03em;
            margin-bottom: var(--spacing-lg);
            color: var(--color-text);
        }

        .hero-grid-title span {
            display: block;
            color: transparent;
            -webkit-text-stroke: 2px var(--color-text);
        }

        [data-theme="dark"] .hero-grid-title span {
            -webkit-text-stroke: 2px var(--color-text);
        }

        .hero-grid-subtitle {
            font-size: 1.25rem;
            color: var(--color-text-secondary);
            margin-bottom: var(--spacing-2xl);
            line-height: 1.6;
            max-width: 500px;
            border-left: 4px solid var(--color-primary);
            padding-left: var(--spacing-md);
        }

        .hero-grid-image-wrapper {
            position: relative;
        }

        .hero-grid-image-wrapper::before {
            content: '';
            position: absolute;
            top: 20px;
            right: -20px;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                45deg,
                var(--color-primary),
                var(--color-primary) 2px,
                transparent 2px,
                transparent 10px
            );
            opacity: 0.2;
            z-index: -1;
        }

        .hero-grid-image {
            width: 100%;
            border: 2px solid var(--color-text);
            box-shadow: 15px 15px 0px var(--color-text);
            transition: all 0.3s ease;
        }
        
        [data-theme="dark"] .hero-grid-image {
             border-color: var(--color-text);
             box-shadow: 15px 15px 0px var(--color-text);
        }

        .hero-grid-image:hover {
            transform: translate(-5px, -5px);
            box-shadow: 20px 20px 0px var(--color-primary);
        }

        @media (max-width: 1024px) {
            .hero-grid-container {
                grid-template-columns: 1fr;
                text-align: center;
            }
            
            .hero-grid-subtitle {
                margin-left: auto;
                margin-right: auto;
                border-left: none;
                border-top: 4px solid var(--color-primary);
                padding-left: 0;
                padding-top: var(--spacing-md);
            }
            
            .hero-grid-image-wrapper {
                margin-top: var(--spacing-2xl);
                max-width: 600px;
                margin-left: auto;
                margin-right: auto;
            }
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="../index.html" class="navbar-brand">
                <span class="navbar-logo">Tyro Dashboard</span>
                <span class="navbar-badge">v1.12.0</span>
            </a>

            <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <div class="navbar-links">
                <a href="../index.html#features" class="navbar-link">Features</a>
                <a href="../index.html#crud-showcase" class="navbar-link">Instant CRUD</a>
                <a href="../index.html#screenshots" class="navbar-link">Screenshots</a>
                <a href="../doc.html" class="navbar-link">Documentation</a>
                <a href="https://github.com/hasinhayder/tyro-dashboard" class="navbar-cta" target="_blank" rel="noopener">
                    GitHub
                </a>
            </div>
        </div>
    </nav>

    <!-- Theme Toggle -->
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </button>

    <!-- Hero Section Option 7 -->
    <section class="hero-grid">
        <div class="hero-grid-container">
            <div class="hero-grid-content">
                <span class="hero-grid-label">v1.12.0 Released</span>
                <h1 class="hero-grid-title">
                    High Impact.
                    <span>Zero Friction.</span>
                </h1>
                <p class="hero-grid-subtitle">
                    The ultimate admin dashboard for Laravel 12. Tyro provides a seamless, robust, and beautiful interface for managing your application's data.
                </p>
                <div class="hero-actions">
                    <a href="../index.html#installation" class="btn btn-primary">
                        Start Now
                    </a>
                    <a href="../doc.html" class="btn btn-secondary">
                        View Docs
                    </a>
                </div>
            </div>
            
            <div class="hero-grid-image-wrapper">
                <img src="../images/1-tyro-dashboard-landing-light.png" alt="Tyro Dashboard" class="hero-grid-image theme-toggle-img" data-light="../images/1-tyro-dashboard-landing-light.png" data-dark="../images/1-tyro-dashboard-landing-dark.png">
            </div>
        </div>
    </section>

    <script src="../script.js"></script>
    <script>
        // Sync theme images
        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                if (mutation.type === 'attributes' && mutation.attributeName === 'data-theme') {
                    const theme = document.documentElement.getAttribute('data-theme');
                    const images = document.querySelectorAll('.theme-toggle-img');
                    images.forEach(img => {
                        img.src = theme === 'dark' ? img.dataset.dark : img.dataset.light;
                    });
                }
            });
        });
        observer.observe(document.documentElement, { attributes: true });
        
        // Initial sync
        const currentTheme = document.documentElement.getAttribute('data-theme');
        if (currentTheme === 'dark') {
            document.querySelectorAll('.theme-toggle-img').forEach(img => {
                img.src = img.dataset.dark;
            });
        }
    </script>
</body>
</html>
