<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tyro Dashboard - Hero Option 6</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <style>
        .hero-dark {
            min-height: 100vh;
            display: flex;
            align-items: center;
            flex-direction: column;
            justify-content: center;
            padding: calc(80px + var(--spacing-2xl)) 0 var(--spacing-4xl);
            background: #0f172a; /* Force dark background base */
            color: #ffffff;
            overflow: hidden;
            position: relative;
        }
        
        /* Force dark mode styles within this section if needed, or just rely on specific classes */
        .hero-dark h1, .hero-dark p {
            color: #ffffff;
        }

        .hero-dark-bg-glow {
            position: absolute;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(37,99,235,0.15) 0%, rgba(15,23,42,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
        }

        .hero-dark-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 30px;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .hero-dark-pretitle {
            color: #60a5fa;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: var(--spacing-md);
            display: block;
        }

        .hero-dark-title {
            font-family: var(--font-display);
            font-size: clamp(3rem, 7vw, 5rem);
            font-weight: 900;
            line-height: 1;
            margin-bottom: var(--spacing-xl);
            background: linear-gradient(180deg, #ffffff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-dark-stats {
            display: flex;
            justify-content: center;
            gap: var(--spacing-3xl);
            margin-bottom: var(--spacing-3xl);
            flex-wrap: wrap;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 800;
            color: #3b82f6;
            font-family: var(--font-display);
        }

        .stat-label {
            font-size: 0.875rem;
            color: #94a3b8;
            font-weight: 500;
        }

        .hero-dark-actions {
            margin-bottom: var(--spacing-4xl);
        }

        .hero-dark-browser {
            background: #1e293b;
            border-radius: var(--radius-xl);
            border: 1px solid #334155;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }

        .browser-header {
            background: #0f172a;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid #334155;
        }

        .browser-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .dot-red { background: #ef4444; }
        .dot-yellow { background: #eab308; }
        .dot-green { background: #22c55e; }

        .browser-content img {
            display: block;
            width: 100%;
            height: auto;
        }

    </style>
</head>

<body style="background-color: #0f172a;"> <!-- Force body bg to match hero for this specific file preview -->
    <!-- Navbar -->
    <nav class="navbar" style="background: rgba(15, 23, 42, 0.8); border-bottom: 1px solid rgba(255,255,255,0.1);">
        <div class="navbar-container">
            <a href="../index.html" class="navbar-brand">
                <span class="navbar-logo" style="background: white; -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Tyro Dashboard</span>
                <span class="navbar-badge">v1.12.0</span>
            </a>

            <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle menu">
                <span style="background: white;"></span>
                <span style="background: white;"></span>
                <span style="background: white;"></span>
            </button>

            <div class="navbar-links">
                <a href="../index.html#features" class="navbar-link" style="color: #cbd5e1;">Features</a>
                <a href="../index.html#crud-showcase" class="navbar-link" style="color: #cbd5e1;">Instant CRUD</a>
                <a href="../index.html#screenshots" class="navbar-link" style="color: #cbd5e1;">Screenshots</a>
                <a href="../doc.html" class="navbar-link" style="color: #cbd5e1;">Documentation</a>
                <a href="https://github.com/hasinhayder/tyro-dashboard" class="navbar-cta" target="_blank" rel="noopener">
                    GitHub
                </a>
            </div>
        </div>
    </nav>

    <!-- Hero Section Option 6 -->
    <section class="hero-dark">
        <div class="hero-dark-bg-glow"></div>
        
        <div class="hero-dark-container">
            <span class="hero-dark-pretitle">Developer Productivity</span>
            <h1 class="hero-dark-title">
                Stop Wasting Time <br>
                On Boilerplate.
            </h1>
            
            <div class="hero-dark-stats">
                <div class="stat-item">
                    <span class="stat-value">100+</span>
                    <span class="stat-label">Hours Saved</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value">Zero</span>
                    <span class="stat-label">Setup Hassle</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value">100%</span>
                    <span class="stat-label">Laravel 12 Ready</span>
                </div>
            </div>

            <div class="hero-dark-actions">
                <a href="../index.html#installation" class="btn btn-primary" style="padding: 12px 32px; font-size: 1.1rem;">
                    Get Started Now
                </a>
            </div>

            <div class="hero-dark-browser">
                <div class="browser-header">
                    <div class="browser-dot dot-red"></div>
                    <div class="browser-dot dot-yellow"></div>
                    <div class="browser-dot dot-green"></div>
                </div>
                <div class="browser-content">
                    <img src="../images/1-tyro-dashboard-landing-dark.png" alt="Tyro Dashboard Dark Mode">
                </div>
            </div>
        </div>
    </section>

    <script src="../script.js"></script>
</body>
</html>
